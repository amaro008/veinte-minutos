<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documento · Veinte Minutos</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="band">
  <div class="fila">
    <div class="t" id="tit">&nbsp;</div>
    <div style="font-size:13px;color:var(--on-dark-muted)" id="ver"></div>
  </div>
  <div class="fila" style="margin-top:10px;gap:16px">
    <a href="/owner.html">Iniciativas</a>
    <a href="#" id="aMemoria">Memoria</a>
  </div>
</div>

<div class="cuerpo">
  <div id="aviso"></div>
  <div class="hoja"><div class="doc" id="doc"></div></div>
  <div class="fila" style="margin-top:16px">
    <button id="agregar" class="suave" style="flex-grow:1">Agregar pregunta al FAQ interno</button>
    <button id="guardar" class="suave" style="flex-grow:1">Guardar versión</button>
  </div>
</div>

<div class="barra">
  <p class="tiny" id="huecos" style="margin:0 0 10px"></p>
  <div class="fila"><button id="invitar">Invitar a leer</button></div>
</div>

<script type="module">
import { sb, exigirSesion, esc, aviso, pintarBloque, SECCIONES } from '/assets/app.js';
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');
await exigirSesion();
const c = await sb();

let doc = null, blocks = [], editando = null;

const ini = (await c.from('initiatives').select('*').eq('id', id).single()).data;
if (!ini) location.href = '/owner.html';
$('tit').textContent = ini.title;
$('aMemoria').href = `/memoria.html?id=${id}`;
$('invitar').onclick = () => location.href = `/sesiones.html?id=${id}`;

async function cargar() {
  const { data } = await c.from('documents').select('*').eq('initiative_id', id)
    .order('version', { ascending: false }).limit(1);
  if (!data || !data.length) { location.href = `/session.html?id=${id}`; return; }
  doc = data[0]; blocks = doc.blocks;
  $('ver').textContent = `Versión ${doc.version}`;
  const abiertos = blocks.filter(b => b.flag && b.status !== 'resolved').length;
  $('huecos').textContent = abiertos
    ? `${abiertos} huecos sin resolver. Puedes invitar igual.`
    : 'Sin huecos marcados.';
  pintar();
}

function pintar() {
  let html = '';
  for (const sec of ['pr', 'faq_ext', 'faq_int']) {
    const bs = blocks.filter(b => b.section === sec);
    if (!bs.length) continue;
    if (sec !== 'pr') html += `<div class="seccion">${SECCIONES[sec]}</div>`;
    for (const b of bs) html += editando === b.id ? editor(b) : lectura(b);
  }
  $('doc').innerHTML = html;
  conectar();
}

function lectura(b) {
  const abierto = b.flag && b.status !== 'resolved';
  return pintarBloque(b) +
    `<div class="fila" style="margin:-12px 0 20px;gap:8px">
       <button class="liga" data-edit="${esc(b.id)}" style="flex-grow:0">Editar</button>
       ${abierto ? `<button class="liga" data-resolve="${esc(b.id)}" style="flex-grow:0">Resolver con evidencia</button>` : ''}
       ${b.flag ? '' : `<button class="liga" data-del="${esc(b.id)}" style="flex-grow:0">Quitar</button>`}
     </div>`;
}

function editor(b) {
  return `<div class="blk">
    ${b.heading !== undefined ? `<input data-h="${esc(b.id)}" value="${esc(b.heading || '')}" placeholder="Encabezado">` : ''}
    <textarea data-t="${esc(b.id)}" style="margin-top:8px">${esc(b.text)}</textarea>
    ${b.flag && b.status !== 'resolved'
      ? `<p class="tiny" style="color:var(--marker-deep);margin-top:8px">Marcado como ${b.flag === 'supuesto' ? 'supuesto sin validar' : 'pregunta abierta'}. Lo puedes reescribir, no borrar la marca. Se quita resolviéndolo con evidencia.</p>` : ''}
    <div class="fila" style="margin-top:10px"><button data-ok="${esc(b.id)}">Listo</button></div>
  </div>`;
}

function conectar() {
  $('doc').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editando = b.dataset.edit; pintar(); });

  $('doc').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => {
    const blk = blocks.find(x => x.id === b.dataset.ok);
    const h = $('doc').querySelector(`[data-h="${b.dataset.ok}"]`);
    if (h) blk.heading = h.value;
    blk.text = $('doc').querySelector(`[data-t="${b.dataset.ok}"]`).value;
    editando = null; pintar();
  });

  $('doc').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('¿Quitar este bloque del documento?')) return;
    blocks = blocks.filter(x => x.id !== b.dataset.del);
    pintar();
  });

  $('doc').querySelectorAll('[data-resolve]').forEach(b => b.onclick = () => {
    const blk = blocks.find(x => x.id === b.dataset.resolve);
    const ev = prompt('¿Con qué evidencia queda resuelto? Escribe el dato o la fuente, no una intención.');
    if (!ev || ev.trim().length < 8) return;
    blk.status = 'resolved'; blk.evidence = ev.trim();
    pintar();
  });
}

$('agregar').onclick = () => {
  const q = prompt('¿Qué pregunta te va a hacer el comité y todavía no está en el documento?');
  if (!q) return;
  blocks.push({ id: 'fi-' + Date.now(), section: 'faq_int', type: 'qa', heading: q.trim(), text: '', flag: 'abierto', status: 'open', evidence: null });
  editando = blocks[blocks.length - 1].id;
  pintar();
};

$('guardar').onclick = async () => {
  $('guardar').disabled = true;
  const { data, error } = await c.from('documents')
    .insert({ initiative_id: id, version: doc.version + 1, blocks }).select().single();
  $('guardar').disabled = false;
  if (error) return aviso($('aviso'), error.message, true);
  doc = data;
  aviso($('aviso'), `Guardado como versión ${doc.version}. Las sesiones nuevas usarán esta.`);
  await cargar();
};

await cargar();
</script>
</body>
</html>
