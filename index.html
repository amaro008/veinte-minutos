<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veinte Minutos</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="band">
  <div class="t">Veinte Minutos</div>
  <div class="s">Se escribe antes de opinar. Se lee en silencio.</div>
</div>

<div class="cuerpo">

  <div class="codigo">
    <p class="rotulo">Tengo un código</p>
    <label for="code" style="color:var(--on-dark-muted)">Código de la sesión</label>
    <input id="code" maxlength="8" autocapitalize="characters" autocomplete="off" placeholder="A7K2QD"
           style="background:var(--ink-2);border-color:var(--ink-line);color:var(--on-dark);font-size:22px;letter-spacing:.12em;font-weight:600">
    <div class="fila" style="margin-top:14px"><button id="entrar">Entrar a leer</button></div>
    <p class="tiny" style="color:var(--on-dark-muted);margin:12px 0 0">Entras sin dar tu nombre ni tu correo. Tus notas son anónimas, también para el autor.</p>
    <div id="avisoCodigo"></div>
  </div>

  <h2>Soy el autor de una iniciativa</h2>
  <div id="zonaAutor">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="fila" style="margin-top:16px">
      <button id="login" class="oscuro">Entrar</button>
      <button id="signup" class="suave">Crear cuenta</button>
    </div>
    <div id="avisoAutor"></div>
  </div>

</div>

<script type="module">
import { sb, sesion, aviso } from '/assets/app.js';
const $ = id => document.getElementById(id);

(async () => {
  if (await sesion()) {
    $('zonaAutor').innerHTML = '<p class="muted">Ya tienes sesión abierta.</p><div class="fila"><a class="btn oscuro" href="/owner.html">Ir a mis iniciativas</a></div>';
  }
})();

const code = new URLSearchParams(location.search).get('code');
if (code) $('code').value = code.toUpperCase();

$('entrar').onclick = () => {
  const c = $('code').value.trim().toUpperCase();
  if (c.length < 4) return aviso($('avisoCodigo'), 'Escribe el código completo.', true);
  location.href = `/read.html?code=${encodeURIComponent(c)}`;
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('entrar').click(); });

async function auth(modo) {
  const email = $('email').value.trim(), password = $('pass').value;
  if (!email || password.length < 6) return aviso($('avisoAutor'), 'Necesitas un correo y una contraseña de al menos 6 caracteres.', true);
  aviso($('avisoAutor'), 'Un momento...');
  try {
    const c = await sb();
    const { error } = modo === 'login'
      ? await c.auth.signInWithPassword({ email, password })
      : await c.auth.signUp({ email, password });
    if (error) throw error;
    if (!await sesion()) return aviso($('avisoAutor'), 'Cuenta creada. Confírmala desde tu correo y vuelve a entrar.');
    location.href = '/owner.html';
  } catch (e) { aviso($('avisoAutor'), e.message, true); }
}
$('login').onclick = () => auth('login');
$('signup').onclick = () => auth('signup');
</script>
</body>
</html>
