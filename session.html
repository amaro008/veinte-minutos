<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facilitador · Veinte Minutos</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="band">
  <div class="fila">
    <div class="t" id="tit">&nbsp;</div>
    <div style="font-size:13px;color:var(--on-dark-muted)" id="cuenta"></div>
  </div>
  <div class="pasos" id="pasos"></div>
</div>

<div class="cuerpo">
  <a class="caja" id="aMemoria" href="#" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px">
    <span style="font-size:14px">Lo que sé de esta iniciativa <span class="muted" id="cuentaNotas"></span></span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#5A6168" stroke-width="1.6" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
  </a>

  <p class="tiny" id="etiqueta"></p>
  <div class="chat" id="chat"></div>
  <div id="aviso"></div>

  <div id="zonaFinal" style="display:none">
    <div class="aviso">Las cinco respuestas están registradas. El borrador se arma solo con ellas, sin agregar datos que tú no hayas dado.</div>
    <div class="fila"><button id="generar">Generar el borrador</button></div>
  </div>
</div>

<div class="barra oscura" id="zonaEscribir">
  <label for="msg">Tu respuesta</label>
  <textarea id="msg" rows="2" placeholder="Escribe aquí" style="min-height:62px"></textarea>
  <div class="fila" style="margin-top:10px">
    <button id="forzar" class="liga" style="flex-grow:0;color:#9BA3AA">Avanzar así</button>
    <div style="flex-grow:1"></div>
    <button id="enviar" style="flex-grow:0">Responder</button>
  </div>
</div>

<script type="module">
import { sb, exigirSesion, api, esc, aviso, PREGUNTAS } from '/assets/app.js';
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');
await exigirSesion();
const c = await sb();

let qActual = 1, ultimo = '', respuestas = [];

const ini = (await c.from('initiatives').select('*').eq('id', id).single()).data;
if (!ini) location.href = '/owner.html';
$('tit').textContent = ini.title;
$('aMemoria').href = `/memoria.html?id=${id}`;

const notas = (await c.from('initiative_notes').select('id').eq('initiative_id', id)).data || [];
$('cuentaNotas').textContent = notas.length ? `· ${notas.length} notas` : '· todavía vacío';

async function cargar() {
  respuestas = (await c.from('answers').select('question_no,quality').eq('initiative_id', id)).data || [];
  const hechas = new Set(respuestas.map(r => r.question_no));
  qActual = [1, 2, 3, 4, 5].find(n => !hechas.has(n)) || 6;
  pintarPasos();

  if (qActual === 6) {
    $('zonaEscribir').style.display = 'none';
    $('zonaFinal').style.display = 'block';
    $('cuenta').textContent = '5 de 5';
    $('etiqueta').textContent = 'Las cinco preguntas están contestadas.';
    $('chat').innerHTML = '';
    return;
  }
  $('cuenta').textContent = `${qActual} de 5`;
  $('etiqueta').textContent = `Pregunta ${qActual}. ${PREGUNTAS[qActual - 1]}`;

  const msgs = (await c.from('facilitator_messages').select('role,content')
    .eq('initiative_id', id).eq('question_no', qActual).order('id')).data || [];
  $('chat').innerHTML = msgs.map(dicho).join('');
  if (!msgs.length) await turno(null); else abajo();
}

function pintarPasos() {
  const q = {}; respuestas.forEach(r => q[r.question_no] = r.quality);
  $('pasos').innerHTML = [1, 2, 3, 4, 5].map(n =>
    `<div class="paso ${q[n] === 'weak' ? 'debil' : q[n] ? 'hecho' : (n === qActual ? 'ahora' : '')}"></div>`).join('');
}

const dicho = m => m.role === 'assistant'
  ? `<div class="dicho"><div class="de">Facilitador</div><div class="texto">${esc(m.content)}</div></div>`
  : `<div class="mio">${esc(m.content)}</div>`;

const abajo = () => window.scrollTo(0, document.body.scrollHeight);

async function turno(texto) {
  $('enviar').disabled = $('forzar').disabled = true;
  aviso($('aviso'), '');
  $('chat').insertAdjacentHTML('beforeend', '<p class="muted" id="cargando"><span class="giro"></span> Pensando</p>');
  abajo();
  try {
    const r = await api('claude', { mode: 'facilitate', initiativeId: id, questionNo: qActual, message: texto });
    $('cargando')?.remove();
    $('chat').insertAdjacentHTML('beforeend', dicho({ role: 'assistant', content: r.reply }));
    if (r.accepted) { $('msg').value = ''; await cargar(); }
  } catch (e) {
    $('cargando')?.remove();
    aviso($('aviso'), e.message, true);
  }
  $('enviar').disabled = $('forzar').disabled = false;
  abajo();
}

$('enviar').onclick = async () => {
  const t = $('msg').value.trim();
  if (!t) return;
  ultimo = t;
  $('chat').insertAdjacentHTML('beforeend', dicho({ role: 'user', content: t }));
  $('msg').value = '';
  await turno(t);
};

$('forzar').onclick = async () => {
  const t = $('msg').value.trim() || ultimo;
  if (!t) return aviso($('aviso'), 'Escribe algo primero. Avanzar así guarda tu respuesta y marca el hueco, no lo salta.', true);
  await c.from('answers').delete().eq('initiative_id', id).eq('question_no', qActual);
  await c.from('answers').insert({ initiative_id: id, question_no: qActual, answer_text: t, quality: 'weak' });
  $('msg').value = '';
  await cargar();
};

$('generar').onclick = async () => {
  $('generar').disabled = true;
  aviso($('aviso'), 'Escribiendo el borrador. Tarda medio minuto.');
  try {
    await api('claude', { mode: 'draft', initiativeId: id });
    location.href = `/document.html?id=${id}`;
  } catch (e) { aviso($('aviso'), e.message, true); $('generar').disabled = false; }
};

await cargar();
</script>
</body>
</html>
